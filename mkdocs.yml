site_name: Documentação do Projeto
site_description: Documentação técnica mantida como código
repo_url: https://github.com/lucaspenhoela-personal/tcc-documentacao-software
edit_uri: edit/main/docs/

theme:
  name: material
  language: pt-BR
  features:
    - navigation.sections
    - navigation.top
    - content.action.edit
    - search.suggest

nav:
  - Início: index.md
  - Guias:
      - Fluxo de revisão por pares: guias/revisao-por-pares.md
      - Definition of Done documental: guias/definition-of-done.md
      - Convenções de escrita: guias/convencoes.md
  - Modelos:
      - README de serviço: modelos/README-servico.md
      - ADR: modelos/ADR-template.md
      - Runbook: modelos/runbook-template.md
      - Documentação de API: modelos/api-template.md
      - Onboarding: modelos/onboarding-template.md
  - Decisões (ADRs):
      - ADR-0001 Adotar Docs-as-Code: adr/0001-adotar-docs-as-code.md
  - Runbooks: runbooks/README.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - pymdownx.superfences

plugins:
  - search:
      lang: pt
